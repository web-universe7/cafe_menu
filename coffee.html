<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Life Cafe - Coffee Collection</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Custom 9:16 Vertical Video Container Styling */
        .video-916-container {
            width: 240px;
            height: 426px; /* Exact 9:16 vertical ratio */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(212, 163, 115, 0.4);
            background: #000;
        }
        .video-916-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- Coffee Showcase Page -->
        <div class="page page-2" style="transform: none; position: relative; width: 100%; height: 100%;">
            <div class="menu-left-content">
                <h2>Our Special Coffee</h2>
                <div class="subtitle">Handcrafted brews made with passion and precision</div>
                
                <div class="menu-category-title">☕ ARTISAN COFFEE SELECTIONS</div>
                <div class="menu-items-grid">
                    <div class="menu-item-row"><span>Signature Espresso</span> <span class="price">₹120</span></div>
                    <div class="menu-item-row"><span>Classic Americano</span> <span class="price">₹140</span></div>
                    <div class="menu-item-row"><span>Velvety Cappuccino</span> <span class="price">₹160</span></div>
                    <div class="menu-item-row"><span>Caramel Latte</span> <span class="price">₹175</span></div>
                    <div class="menu-item-row"><span>Dark Mocha Roast</span> <span class="price">₹180</span></div>
                    <div class="menu-item-row"><span>Hazelnut Delight</span> <span class="price">₹190</span></div>
                </div>

                <div class="menu-category-title" style="margin-top: 15px;">❄️ ICED & COLD BREWS</div>
                <div class="menu-items-grid">
                    <div class="menu-item-row"><span>Iced Vanilla Latte</span> <span class="price">₹185</span></div>
                    <div class="menu-item-row"><span>Cold Brew Classic</span> <span class="price">₹179</span></div>
                </div>
            </div>

            <!-- Right Visuals with 9:16 Vertical Video -->
            <div class="menu-right-visuals" style="background: rgba(212, 163, 115, 0.08); border-radius: 20px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div class="video-916-container">
                    <video autoplay muted loop playsinline>
                        <source src="https://pqxfjszlxpnyjrygiydb.supabase.co/storage/v1/object/public/cafe_assets/vedio_2.mp4" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>

            <!-- Clean Grouped Navigation Buttons -->
            <div class="nav-buttons-group">
                <button class="btn-back" onclick="window.location.href='index.html'">⬅ Back to Home</button>
                <button class="btn-next" onclick="window.location.href='dishes.html'">Dishes Menu ➔</button>
            </div>
        </div>
    </div>

</body>
</html>
